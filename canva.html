<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estrutura 1ª Instância</title>
    <style>
        :root {
            --gold-color: #e3a936;
            --blue-color: #2c7da0;
            --gray-center: #dcdcdc;
            --text-color: #333;
            --white: #fff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9f9f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        h1 {
            text-transform: uppercase;
            color: #222;
            font-size: 24px;
            letter-spacing: 1px;
            margin-bottom: 40px; /* Espaço entre título e gráfico */
        }

        /* Container Principal do Gráfico */
        .diagram-container {
            position: relative;
            width: 900px;
            height: 350px;
            /* background: rgba(0,0,0,0.05); Debug: descomente para ver a área */
        }

        /* --- CENTRO (ESTRUTURA) --- */
        .center-hub {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 180px;
            height: 180px;
            z-index: 2;
        }

        /* Anel Azul com Pontos */
        .hub-ring {
            width: 100%;
            height: 100%;
            border: 3px solid var(--blue-color);
            border-radius: 50%;
            position: absolute;
            box-sizing: border-box;
        }

        /* Círculo Cinza Interno */
        .hub-core {
            position: absolute;
            top: 15px; /* Espaçamento interno do anel */
            left: 15px;
            right: 15px;
            bottom: 15px;
            background: radial-gradient(circle, #e6e6e6 0%, #ccc 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }

        .hub-core span {
            font-weight: 700;
            font-size: 18px;
            color: #333;
            text-transform: uppercase;
        }

        /* Pontos (Dots) ao redor do anel */
        .dot {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #ccc; /* Cinza claro como na imagem */
            border-radius: 50%;
            top: 50%;
            left: 50%;
            margin-top: -5px;
            margin-left: -5px;
        }
        /* Posicionamento dos pontos usando transform */
        .dot:nth-child(1) { transform: rotate(0deg) translate(90px); }
        .dot:nth-child(2) { transform: rotate(30deg) translate(90px); }
        .dot:nth-child(3) { transform: rotate(60deg) translate(90px); }
        .dot:nth-child(4) { transform: rotate(90deg) translate(90px); }
        .dot:nth-child(5) { transform: rotate(120deg) translate(90px); }
        .dot:nth-child(6) { transform: rotate(150deg) translate(90px); }
        .dot:nth-child(7) { transform: rotate(180deg) translate(90px); }
        .dot:nth-child(8) { transform: rotate(210deg) translate(90px); }
        .dot:nth-child(9) { transform: rotate(240deg) translate(90px); }
        .dot:nth-child(10) { transform: rotate(270deg) translate(90px); }
        .dot:nth-child(11) { transform: rotate(300deg) translate(90px); }
        .dot:nth-child(12) { transform: rotate(330deg) translate(90px); }


        /* --- ITENS LATERAIS (Pílulas Douradas) --- */
        .item-node {
            position: absolute;
            background-color: var(--gold-color);
            border-radius: 50px;
            height: 60px;
            display: flex;
            align-items: center;
            padding: 5px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
            min-width: 280px;
            z-index: 3;
        }

        /* Círculo branco com número */
        .number-circle {
            background: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid var(--blue-color); /* Borda azul interna */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #000;
            flex-shrink: 0;
            position: relative;
        }
        
        /* Borda azul externa (offset) do círculo branco - simulando o estilo da imagem */
        .number-circle::before {
            content: '';
            position: absolute;
            top: -6px; left: -6px; right: -6px; bottom: -6px;
            border: 2px solid var(--blue-color);
            border-radius: 50%;
            pointer-events: none;
        }

        .label-text {
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 14px;
            line-height: 1.2;
            padding: 0 15px;
            flex-grow: 1;
        }

        /* --- Posicionamento Específico dos Nós --- */

        /* Esquerda Superior */
        .node-left-top {
            top: 20px;
            left: 0;
            justify-content: flex-end; /* Texto na esquerda, bola na direita */
            text-align: right;
            flex-direction: row;
        }
        .node-left-top .label-text { padding-right: 15px; }

        /* Esquerda Inferior */
        .node-left-bottom {
            bottom: 40px;
            left: 20px; /* Ligeiramente mais recuado que o de cima */
            justify-content: flex-end;
            text-align: right;
            flex-direction: row;
        }

        /* Direita Superior */
        .node-right {
            top: 25px;
            right: 0;
            flex-direction: row-reverse; /* Bola na esquerda, Texto na direita */
            text-align: left; /* Mudança aqui: texto alinhado à esquerda para ler natural */
            justify-content: flex-end; /* Mantém elementos nas pontas */
        }
        .node-right .label-text { text-align: center; } /* Ajuste fino */


        /* --- LINHAS CONECTORAS (SVG ou DIVs) --- */
        /* Usando DIVs rotacionadas para conectar os nós ao centro */
        .connector {
            position: absolute;
            height: 3px;
            background-color: var(--blue-color);
            transform-origin: 0 50%; /* Gira a partir da ponta esquerda */
            z-index: 1; /* Atrás dos nós */
        }

        /* Linha Esquerda Superior */
        .line-1 {
            top: 130px; /* Centro vertical aproximado do anel */
            left: 310px; /* Ponto de saída do nó */
            width: 140px;
            transform: rotate(25deg); /* Ajuste de ângulo */
        }

        /* Linha Esquerda Inferior */
        .line-2 {
            top: 250px;
            left: 330px;
            width: 120px;
            transform: rotate(-10deg); /* Quase reto */
        }
        
        /* Ajuste fino visual: A imagem mostra a linha saindo do anel azul para o círculo branco */
        
        /* Correção das Linhas: Partindo do Centro para fora */
        .line-center-origin {
            position: absolute;
            background-color: var(--blue-color);
            height: 3px;
            top: 50%;
            left: 50%;
            transform-origin: 0 50%;
            z-index: 1;
        }

        /* Linha para Topo Esquerda (Forum) */
        .c-line-1 {
            width: 170px;
            transform: rotate(200deg); /* Aponta para ~10h */
        }

        /* Linha para Baixo Esquerda (Central) */
        .c-line-2 {
            width: 170px;
            transform: rotate(170deg); /* Aponta para ~9h */
        }

        /* Linha para Direita (Salas) */
        .c-line-3 {
            width: 170px;
            transform: rotate(-20deg); /* Aponta para ~2h */
        }

    </style>
</head>
<body>

    <h1>1ª INSTÂNCIA</h1>

    <div class="diagram-container">
        
        <div class="center-hub">
            <div class="hub-ring">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div>
                <div class="dot"></div><div class="dot"></div><div class="dot"></div>
                <div class="dot"></div><div class="dot"></div><div class="dot"></div>
                <div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>
            <div class="hub-core">
                <span>ESTRUTURA</span>
            </div>
        </div>

        <div class="line-center-origin c-line-1"></div>
        <div class="line-center-origin c-line-2"></div>
        <div class="line-center-origin c-line-3"></div>

        <div class="item-node node-left-top" style="left: 40px; top: 60px;">
            <span class="label-text">Fóruns Digitais (*)</span>
            <div class="number-circle">8</div>
        </div>

        <div class="item-node node-left-bottom" style="left: 10px; bottom: 60px;">
            <span class="label-text">Central de Processo<br>Eletrônico</span>
            <div class="number-circle">1</div>
        </div>

        <div class="item-node node-right" style="right: 40px; top: 60px;">
            <div class="number-circle">297</div>
            <span class="label-text">Salas de Depoimento<br>Especial</span>
        </div>

    </div>

</body>
</html>
